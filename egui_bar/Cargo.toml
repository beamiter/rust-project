[package]
name = "egui_bar"
version = "0.2.0"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
description = "A modern system status bar built with egui"

[dependencies]
# 序列化
serde = { workspace = true }

# 日志
log = { workspace = true }
anyhow = { workspace = true }

# 实用工具
chrono = { workspace = true }

# 共享内存（原项目依赖）
shared_structures = { workspace = true }
# shared_structures = { path = "../shared_structures", features = ["use-eventfd"] }
# shared_structures = { path = "../shared_structures", features = ["use-semaphore"] }
# shared_structures = { path = "../shared_structures", features = ["use-futex"] }
xbar_core = { workspace = true }
tokio = { workspace = true }

font-kit = "0.14"
eframe = { version = "0.32.3", features = ["persistence"] }
egui_plot = "0.33.0"
egui = "0.32.3"

# Config system
toml = { workspace = true }
notify = "8"
dirs = "6.0"
arc-swap = { workspace = true }
once_cell = { workspace = true }

# Phase 3: New modules
mpris = "2.0"

# Phase 7: System tray
system-tray = "0.8"

# Wayland layer-shell (Phase 4)
smithay-client-toolkit = { version = "0.19", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols-wlr = { version = "0.3", optional = true, features = ["client"] }
raw-window-handle = { version = "0.6", optional = true }

[features]
default = ["x11"]
x11 = []
wayland = [
    "dep:smithay-client-toolkit",
    "dep:wayland-client",
    "dep:wayland-protocols-wlr",
    "dep:raw-window-handle",
]

debug_mode = []
